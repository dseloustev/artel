name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Latest stable interpreter only (2026-10-19 decision, docs/design.md).
        # 3.9 remains the compatibility floor the hooks are written to (see
        # hooks/sensitive_guard.py); it was verified green once and is not a
        # per-change CI target. Bump this pin when a newer release is adopted.
        python-version: ['3.14']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # No dependencies: the hooks, the gate scripts and the suite are stdlib-only
      # by design, so there is nothing to install and nothing to cache.
      - name: Run the test suite
        run: python3 -m unittest discover -s tests -p 'test_*.py' --verbose
